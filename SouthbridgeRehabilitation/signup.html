<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Southbridge Rehabilitation - Sign Up</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e8f1f7,#cddfea)}
.card{width:92%;max-width:450px;background:#fff;padding:35px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
h1{text-align:center;margin:0 0 8px;color:#17324d;font-size:28px}h2{text-align:center;margin:0 0 28px;color:#607789;font-size:18px;font-weight:normal}
label{display:block;margin:14px 0 6px;font-weight:bold;color:#263b4d}
input{width:100%;padding:12px;border:1px solid #b7c5cf;border-radius:6px;font-size:16px;box-sizing:border-box}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:6px;background:#1f5f8b;color:white;font-size:17px;font-weight:bold;cursor:pointer}
button:hover{background:#174b6e}.login{text-align:center;margin-top:20px;color:#607789}.login a{color:#1f5f8b;font-weight:bold;text-decoration:none}.note{text-align:center;font-size:13px;color:#718394;margin-top:18px}
</style>
</head>
<body>
<div class="card">
<h1>SOUTHBRIDGE REHABILITATION</h1>
<h2>Create Your Account</h2>
<form action="signup.php" method="POST">
<label for="full_name">Full Name</label>
<input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required maxlength="255">
<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="Enter your email" required maxlength="255">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
<label for="confirm_password">Confirm Password</label>
<input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required minlength="8">
<button type="submit">Create Account</button>
</form>
<div class="login">Already have an account? <a href="signin.html">Sign In</a></div>
<div class="note">Your password is securely encrypted before being stored.</div>
</div>
</body>
</html>
